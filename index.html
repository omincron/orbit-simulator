<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal 2D Orbit Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="sim-canvas" aria-label="2D orbit simulation"></canvas>
    <section class="hud" aria-label="Simulation controls and telemetry">

      <!-- Always-visible compact bar -->
      <div class="panel hud-bar">
        <div class="hud-bar-row">
          <input
            id="speed-slider"
            type="range"
            min="0.6"
            max="1.4"
            step="0.01"
            value="1.00"
            aria-label="Speed multiplier"
          />
          <output id="speed-factor-value" for="speed-slider">1.00x</output>
          <button id="reset-button" type="button" title="Reset to circular orbit">↺</button>
          <button id="hud-toggle" type="button" aria-expanded="false" title="Show telemetry">▾</button>
        </div>
      </div>

      <!-- Collapsible telemetry + extended controls -->
      <div class="panel telemetry-panel" id="hud-drawer" hidden>
        <dl>
          <div><dt>Speed</dt><dd id="speed-readout">0 km/s</dd></div>
          <div><dt>Altitude</dt><dd id="altitude-readout">0 km</dd></div>
          <div><dt>Radius</dt><dd id="radius-readout">0 km</dd></div>
          <div><dt>Circular Speed</dt><dd id="circular-speed-readout">0 km/s</dd></div>
          <div><dt>Orbit Ratio</dt><dd id="orbit-ratio-readout">0.00x</dd></div>
          <div><dt>Sim Time</dt><dd id="sim-time-readout">0 min</dd></div>
        </dl>
      </div>

    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
